name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  site:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      # Upstream workflow-catalog branches are intentionally unpublished. CI
      # verifies the exact embedded artifact; maintainers regenerate it from
      # the sibling Outfitter and community-profiles worktrees before commit.
      AGENTS_CATALOG_EMBEDDED_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:checkout
        env:
          AI_OUTFITTER_GIT_BASE_URL: https://github.com/ai-outfitter
      - run: npm run check
      - run: npm run test:worker
      - run: npm run build
      - run: npm run test:dashboard
      - run: npm run test:analytics
      - run: npm run test:links
      - run: npm run test:publish
      - run: npm run test:search
      - run: npm run test:workflows
      - run: npm exec -- wrangler deploy --dry-run
      - name: Package preview assets
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: preview-assets
          path: dist
          if-no-files-found: error
          retention-days: 1
      - name: Deploy production Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm exec -- wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: preview/pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: preview-assets
          path: dist
      - name: Deploy preview Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_NAME: ai-outfitter-website-pr-${{ github.event.number }}
        run: |
          npm exec -- wrangler deploy \
            --env preview \
            --name "$PREVIEW_NAME" \
            --message "Preview for PR #${{ github.event.number }} at ${{ github.event.pull_request.head.sha }}" \
            --tag "pr-${{ github.event.number }}" | tee "$RUNNER_TEMP/wrangler-preview.log"

          preview_url=$(sed -nE 's#.*(https://[^[:space:]]+\.workers\.dev).*#\1#p' "$RUNNER_TEMP/wrangler-preview.log" | tail -1)
          if [[ -z "$preview_url" ]]; then
            echo "Wrangler did not return a preview URL." >&2
            exit 1
          fi

          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[$preview_url]($preview_url)" >> "$GITHUB_STEP_SUMMARY"

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 52b3dd3372a05fd2be0eb0f8ec36f9d3
          PREVIEW_NAME: ai-outfitter-website-pr-${{ github.event.number }}
        run: |
          response_file=$(mktemp)
          status=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$PREVIEW_NAME?force=true")

          if [[ "$status" == "200" || "$status" == "404" ]]; then
            echo "Deleted $PREVIEW_NAME (Cloudflare HTTP $status)."
            exit 0
          fi

          echo "Cloudflare could not delete $PREVIEW_NAME (HTTP $status)." >&2
          jq '{success, errors, messages}' "$response_file" >&2
          exit 1
