name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:checkout
        env:
          AI_OUTFITTER_GIT_BASE_URL: https://github.com/ai-outfitter
      - run: npm run check
      - run: npm run build
      - run: npm run test:links
      - run: npm run test:publish
      - run: npm run test:search
      - run: npm run test:workflows
      - run: npm exec -- wrangler deploy --dry-run
