id: factory
title: Software factory
nodes:
  - {id: request, action: request-change, actor: nicholas, environment: workstation}
  - {id: issue, action: create-issue, actor: claude, environment: workstation, needs: [request], uses: [github-write]}
  - {id: assign_issue, action: assign-issue, actor: claude, environment: workstation, assignee: luce, event: issues.assigned, needs: [issue], uses: [github-write], shape: event}
  - {id: implement, action: draft-pr, actor: luce, environment: kubernetes, needs: [assign_issue], uses: [channels-github, github-write, git-https]}
  - {id: ready, action: pr-undrafted, actor: luce, environment: kubernetes, needs: [implement], checks: [verify], uses: [github-write]}
  - {id: review, workflow: adversarial-review, needs: [ready]}
  - {id: revise, action: address-findings, actor: luce, environment: kubernetes, needs: [review], if: "review.outcome == 'request-changes'", uses: [channels-github, github-write, git-https]}
  - {id: merge, action: merge, actor: merge-bot, environment: actions, needs: [review], if: "review.outcome == 'approve'", checks: [verify], uses: [github-merge]}
