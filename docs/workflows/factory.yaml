version: 2

prompt_fragments:
  subagent-delegation:
    source: ai-outfitter/community-profiles
    status: planned

actors:
  org-admin: {kind: human}
  employee: {kind: human}
  employee-agent: {kind: agent, profile: engineer, can: [issues:write]}
  outfitter: {kind: tool}
  resident-agent: {kind: agent, profile: engineer, can: [contents:write, pull-requests:write]}
  implementation-agent: {kind: agent, profile: engineer, can: [contents:write, pull-requests:write]}
  luce: {kind: agent, harness: pi, profile: luce, can: [contents:write, pull-requests:write]}
  review-bot: {kind: agent, harness: pi, profile: code-review, can: [reviews:approve]}
  merge-bot: {kind: agent, harness: codex, profile: git-forge-delegator, can: [pull-requests:merge]}
  incident-bot: {kind: agent, harness: pi, profile: incident-investigation, can: [issues:write]}
  outfitter-bot: {kind: agent, harness: pi, profile: actions-agent, can: [issues:write]}
  review-coordinator: {kind: agent, harness: pi, profile: founder, skills: [persona-review], can: [contents:read, contents:write]}
  persona-reviewer: {kind: agent, harness: pi, profile: persona-reviewer, skills: [persona-review], can: [contents:read]}

environments:
  workstation: local
  kubernetes: agent-operator
  actions: github-actions
  observability: grafana
  delegated-runtime: delegated-runtime

integrations:
  channels-github: {kind: wake, label: Channels / GitHub, provider: ai-outfitter/channels, source: github}
  channels-email: {kind: wake, label: Channels / Email, provider: ai-outfitter/channels, source: jmap}
  github-actions-events: {kind: trigger, label: GitHub Actions, provider: github, source: github}
  grafana-read: {kind: mcp, label: Grafana, server: grafana-read, tools: [get_alert_rule_by_uid, query_prometheus, query_loki_logs, get_dashboard_by_uid]}
  github-write: {kind: mcp, label: GitHub, server: github-write, tools: [issue_read, issue_write, create_pull_request, update_pull_request, pull_request_read, pull_request_review_write, add_comment_to_pending_review, add_issue_comment]}
  github-merge: {kind: mcp, label: GitHub, server: github-merge, tools: [pull_request_read, merge_pull_request]}
  playwright-browser: {kind: mcp, label: "Chrome / Playwright (optional)", server: playwright, tools: [browser_navigate, browser_snapshot, browser_take_screenshot]}
  outfitter-cli: {kind: cli, label: Outfitter}
  pi-harness: {kind: harness, label: Pi}
  claude-code-harness: {kind: harness, label: Claude Code}
  gh: {kind: cli, label: gh}
  git-https: {kind: transport, label: Git HTTPS}

checks:
  verify:
    commands: [outfitter validate --strict, git diff --check origin/main...HEAD]
    local: pre-commit
    required_status: test

workflows:
  - id: organization-delegation
    title: Organization-wide delegation
    status: target-state
    nodes:
      - {id: publish_catalog, action: publish-organization-catalog, actor: org-admin, environment: workstation, path: org/.agents, uses: [github-write]}
      - {id: sync_catalog, action: run-outfitter-sync, actor: employee, environment: workstation, needs: [publish_catalog], uses: [outfitter-cli]}
      - {id: project_pi, action: compose-prompt-in-pi, actor: outfitter, environment: workstation, needs: [sync_catalog], prompt_fragment: subagent-delegation, uses: [outfitter-cli, pi-harness]}
      - {id: project_claude, action: compose-prompt-in-claude-code, actor: outfitter, environment: workstation, needs: [sync_catalog], prompt_fragment: subagent-delegation, uses: [outfitter-cli, claude-code-harness]}
      - {id: request, action: request-delegated-work, actor: employee, environment: workstation, needs: [project_pi, project_claude]}
      - {id: create_issue, action: create-scoped-issue, actor: employee-agent, environment: workstation, needs: [request], prompt_fragment: subagent-delegation, uses: [github-write]}
      - {id: triage, workflow: issue-triage, needs: [create_issue]}

  - id: factory
    title: Software factory
    nodes:
      - {id: implement, action: draft-pr, actor: implementation-agent, environment: delegated-runtime, uses: [channels-github, github-write, git-https]}
      - {id: ready, action: pr-undrafted, actor: implementation-agent, environment: delegated-runtime, needs: [implement], checks: [verify], uses: [github-write]}
      - {id: review, workflow: adversarial-review, needs: [ready]}
      - {id: revise, action: address-findings, actor: implementation-agent, environment: delegated-runtime, needs: [review], if: "review.outcome == 'request-changes'", uses: [channels-github, github-write, git-https]}
      - {id: merge, action: merge, actor: merge-bot, environment: actions, needs: [review], if: "review.outcome == 'approve'", checks: [verify], uses: [github-merge]}

  - id: adversarial-review
    title: Adversarial review
    triggers:
      - {integration: channels-github, event: pull_request.review_requested, rule: CODEOWNERS, environment: kubernetes}
    outputs: [outcome]
    nodes:
      - {id: inspect, action: inspect-change, actor: review-bot, environment: kubernetes, uses: [github-write]}
      - {id: decide, action: decide-review, actor: review-bot, environment: kubernetes, needs: [inspect], outputs: [outcome], shape: decision}
      - {id: approve, action: approve, actor: review-bot, environment: kubernetes, needs: [decide], if: "decide.outcome == 'approve'", result: {outcome: approve}, uses: [github-write]}
      - {id: request_changes, action: request-changes, actor: review-bot, environment: kubernetes, needs: [decide], if: "decide.outcome == 'request-changes'", result: {outcome: request-changes}, uses: [github-write]}

  - id: bug-issue
    title: Bug issue
    triggers:
      - {integration: github-actions-events, event: issues.labeled, rule: "label = fix", environment: actions}
    nodes:
      - {id: investigate, action: quick-investigation, actor: outfitter-bot, environment: actions, skill: issue-triage, uses: [gh]}
      - {id: assign, action: assign-issue, actor: outfitter-bot, environment: actions, assignee: luce, target_environment: kubernetes, needs: [investigate], uses: [gh], shape: event}

  - id: issue-triage
    title: Issue triage
    triggers:
      - {integration: github-actions-events, event: issues.opened, environment: actions}
    nodes:
      - {id: classify, action: classify-issue, actor: outfitter-bot, environment: actions, skill: issue-triage, templates: [feat.yml, fix.yml, research.yml], outputs: [kind], uses: [gh], shape: decision}
      - {id: route_feature, action: choose-implementation-route, actor: outfitter-bot, environment: actions, needs: [classify], if: "classify.kind == 'feat'", outputs: [executor], rule: "matching deployed resident; otherwise app", uses: [gh], shape: decision}
      - {id: assign_resident, action: assign-resident-agent, actor: outfitter-bot, environment: actions, assignee: resident-agent, event: issues.assigned, needs: [route_feature], if: "route_feature.executor == 'resident'", uses: [gh], shape: event}
      - {id: trigger_app, action: add-ai-outfitter-label, actor: outfitter-bot, environment: actions, label: ai-outfitter, event: issues.labeled, needs: [route_feature], if: "route_feature.executor == 'app'", uses: [gh], shape: event}
      - {id: resident_factory, workflow: factory, needs: [assign_resident]}
      - {id: app_factory, workflow: factory, needs: [trigger_app]}
      - {id: bug, workflow: bug-issue, needs: [classify], if: "classify.kind == 'fix'"}
      - {id: research, workflow: research-triage, needs: [classify], if: "classify.kind == 'research'"}

  - id: research-triage
    title: Research triage
    triggers:
      - {integration: github-actions-events, event: issues.labeled, rule: "label = research", environment: actions}
    nodes:
      - {id: classify, action: classify-research, actor: outfitter-bot, environment: actions, skill: research-triage, templates: [research.yml], outputs: [kind], uses: [gh], shape: decision}
      - {id: market_competitive, action: label-market-competitive, actor: outfitter-bot, environment: actions, needs: [classify], if: "classify.kind == 'market/competitive'", label: "research:market-competitive", uses: [gh]}
      - {id: technical_spike, action: label-technical-spike, actor: outfitter-bot, environment: actions, needs: [classify], if: "classify.kind == 'technical/spike'", label: "research:technical-spike", uses: [gh]}
      - {id: business_finance, action: label-business-finance, actor: outfitter-bot, environment: actions, needs: [classify], if: "classify.kind == 'business/finance'", label: "research:business-finance", uses: [gh]}

  - id: grafana-alert
    title: Grafana alert investigation
    triggers:
      - {integration: channels-email, event: jmap.Email/new, source: grafana, environment: kubernetes}
    nodes:
      - {id: investigate, action: investigate-alert, actor: incident-bot, environment: kubernetes, skill: incident-investigation, uses: [grafana-read]}
      - {id: issue, action: create-fix-issue, actor: incident-bot, environment: kubernetes, needs: [investigate], event: issues.opened, template: fix.yml, uses: [github-write]}
      - {id: triage, workflow: issue-triage, needs: [issue]}

  - id: persona-review
    title: Persona review
    nodes:
      - {id: select_context, action: select-persona-and-artifact, actor: review-coordinator, environment: workstation, skill: persona-review}
      - {id: launch, action: launch-isolated-reviewer, actor: review-coordinator, environment: workstation, assignee: persona-reviewer, needs: [select_context], uses: [outfitter-cli]}
      - {id: inspect, action: inspect-artifact, actor: persona-reviewer, environment: workstation, needs: [launch], skill: persona-review, uses: [playwright-browser]}
      - {id: report, action: write-sourced-report, actor: persona-reviewer, environment: workstation, needs: [inspect], outputs: [report]}
      - {id: capture, action: atomically-save-report, actor: review-coordinator, environment: workstation, needs: [report], path: docs/persona-reviews/, uses: [outfitter-cli]}
