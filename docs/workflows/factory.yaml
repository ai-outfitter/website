version: 2

prompt_fragments:
  subagent-delegation:
    source: ai-outfitter/community-profiles
    status: planned

actors:
  org-admin: {kind: human}
  employee: {kind: human}
  founder-agent: {kind: agent, profile: founder, identity: human, can: [contents:write, pull-requests:write]}
  engineer-agent: {kind: agent, profile: engineer, identity: human, can: [contents:write, pull-requests:write, pull-requests:merge]}
  employee-agent: {kind: agent, profile: engineer, can: [issues:write]}
  outfitter: {kind: tool}
  resident-agent: {kind: agent, profile: engineer, can: [contents:write, pull-requests:write]}
  luce: {kind: agent, harness: pi, profile: luce, can: [contents:write, pull-requests:write]}
  review-bot: {kind: agent, harness: pi, profile: engineer, skills: [code-review], can: [reviews:approve]}
  github-platform: {kind: system, can: [pull-requests:merge]}
  incident-bot: {kind: agent, harness: pi, profile: incident-investigation, can: [issues:write]}
  outfitter-bot: {kind: agent, harness: pi, profile: actions-agent, can: [issues:write]}
  review-coordinator: {kind: agent, harness: pi, profile: founder, skills: [persona-review], can: [contents:read, contents:write]}
  persona-reviewer: {kind: agent, harness: pi, profile: persona-reviewer, skills: [persona-review], can: [contents:read]}

environments:
  workstation: local
  kubernetes: agent-operator
  actions: github-actions
  delegated-runtime: delegated-runtime

integrations:
  channels-github: {kind: wake, label: Channels / GitHub, provider: ai-outfitter/channels, source: github}
  channels-email: {kind: wake, label: Channels / Email, provider: ai-outfitter/channels, source: jmap}
  github-actions-events: {kind: trigger, label: GitHub Actions, provider: github, source: github}
  grafana-read: {kind: mcp, label: Grafana, server: grafana-read, tools: [get_alert_rule_by_uid, query_prometheus, query_loki_logs, get_dashboard_by_uid]}
  github: {kind: mcp, label: GitHub, server: github, tools: [issue_read, issue_write, create_pull_request, update_pull_request, pull_request_read, pull_request_review_write, add_comment_to_pending_review, add_issue_comment, merge_pull_request]}
  playwright-browser: {kind: mcp, label: "Chrome / Playwright (optional)", server: playwright, tools: [browser_navigate, browser_snapshot, browser_take_screenshot]}
  outfitter-cli: {kind: cli, label: Outfitter}
  pi-harness: {kind: harness, label: Pi}
  claude-code-harness: {kind: harness, label: Claude Code}
  gh: {kind: cli, label: gh}
  git-https: {kind: transport, label: Git HTTPS}
  git-worktree: {kind: transport, label: Git worktree}

checks:
  verify:
    commands: [outfitter validate --strict, git diff --check origin/main...HEAD]
    local: pre-commit
    required_status: test

workflows:
  - id: organization-delegation
    title: Organization-wide delegation
    description: Publish shared agent profiles and delegate scoped work into issue triage.
    status: target-state
    nodes:
      - {id: publish_catalog, action: publish-organization-catalog, description: "Publish shared profiles for the organization.", actor: org-admin, environment: workstation, path: org/.agents, uses: [github]}
      - {id: sync_catalog, action: run-outfitter-sync, description: "Pull organization profiles into the project.", actor: employee, environment: workstation, needs: [publish_catalog], uses: [outfitter-cli]}
      - {id: project_pi, action: compose-prompt-in-pi, description: "Compose delegation guidance for Pi.", actor: outfitter, environment: workstation, needs: [sync_catalog], prompt_fragment: subagent-delegation, uses: [outfitter-cli, pi-harness]}
      - {id: project_claude, action: compose-prompt-in-claude-code, description: "Compose delegation guidance for Claude Code.", actor: outfitter, environment: workstation, needs: [sync_catalog], prompt_fragment: subagent-delegation, uses: [outfitter-cli, claude-code-harness]}
      - {id: request, action: request-delegated-work, description: "Describe the scoped work to delegate.", actor: employee, environment: workstation, needs: [project_pi, project_claude]}
      - {id: create_issue, action: create-scoped-issue, description: "Open an issue with the delegated scope.", actor: employee-agent, environment: workstation, needs: [request], prompt_fragment: subagent-delegation, uses: [github]}
      - {id: triage, workflow: issue-triage, description: "Classify and route the delegated issue.", needs: [create_issue]}

  - id: founder
    title: Founder
    description: Ship changes locally as a human-authenticated founder agent, with optional worktree isolation and adversarial review.
    nodes:
      - {id: start, action: start-local-agent-as-human, description: "Use the human's authenticated local identity.", actor: founder-agent, environment: workstation, uses: [gh, git-https]}
      - {id: work, action: iterate, description: "Work on main by default, or use a worktree for parallel CI/CD or review.", actor: founder-agent, environment: workstation, needs: [start], uses: [git-worktree]}
      - {id: verify, action: verify-locally, description: "Run local checks before committing.", actor: founder-agent, environment: workstation, needs: [work], checks: [verify]}
      - {id: commit, action: commit-locally, description: "Record the verified change locally.", actor: founder-agent, environment: workstation, needs: [verify], uses: [git-worktree]}
      - {id: review, workflow: adversarial-review, description: "Get an independent review before pushing.", mode: local, needs: [commit]}
      - {id: push, action: push-as-human, description: "Publish the approved commit as the human.", actor: founder-agent, environment: workstation, needs: [review], if: "review.outcome == 'approve'", uses: [gh, git-https]}

  - id: engineer
    title: Engineer
    description: Turn a bare bug report into a scoped issue, a CI-gated pull request, a self-started adversarial review, and a human merge.
    nodes:
      - {id: issue, action: file-scoped-issue, description: "Reproduce the report and file one scoped issue with checkable acceptance criteria.", actor: engineer-agent, environment: workstation, skill: scoped-issues, uses: [github]}
      - {id: develop, action: implement-on-semantic-branch, description: "Fix on a semantic branch with the regression test the issue demands.", actor: engineer-agent, environment: workstation, needs: [issue], uses: [git-https]}
      - {id: draft, action: push-draft-pr-as-human, description: "Open a draft pull request referencing the issue.", actor: engineer-agent, environment: workstation, needs: [develop], uses: [gh, git-https]}
      - {id: ci, action: wait-for-required-ci, description: "Wait for every required check to pass.", actor: engineer-agent, environment: workstation, needs: [draft], checks: [verify], shape: gate, uses: [gh]}
      - {id: ready, action: undraft-pr, description: "Mark the pull request ready for review.", actor: engineer-agent, environment: workstation, needs: [ci], uses: [gh]}
      - {id: review, workflow: adversarial-review, description: "Start the adversarial review of your own pull request.", mode: self-started, needs: [ready]}
      - {id: revise, action: fix-blocking-findings, description: "Fix each blocking finding, push, and review the new revision.", actor: engineer-agent, environment: workstation, needs: [review], if: "review.outcome == 'request-changes'", uses: [gh, git-https]}
      - {id: merge, action: verify-and-merge-as-human, description: "The human verifies the acceptance criteria and merges.", actor: employee, environment: workstation, needs: [review], if: "review.outcome == 'approve'", checks: [verify], uses: [gh]}
    feedback:
      - {from: revise, to: ci, label: rerun CI and re-review the new revision}

  - id: software-factory
    title: Software factory
    description: Delegate typed issues to resident agents for CI-gated implementation, adversarial review, and automatic merge.
    nodes:
      - {id: prepare_issue, action: receive-issue-and-categorize-only-if-untyped, description: "Accept the issue and add a type only if missing.", actor: resident-agent, environment: delegated-runtime, uses: [channels-github, github]}
      - {id: assign, action: assign-or-confirm-coding-work-to-resident, description: "Confirm a resident agent owns the coding work.", actor: resident-agent, environment: delegated-runtime, needs: [prepare_issue], rule: "a configured resident owns the task", uses: [github]}
      - {id: worktree, action: create-worktree, description: "Isolate implementation in a dedicated worktree.", actor: resident-agent, environment: delegated-runtime, needs: [assign], uses: [git-https]}
      - {id: research, action: research, description: "Investigate the issue and solution space.", actor: resident-agent, environment: delegated-runtime, needs: [worktree], uses: [github]}
      - {id: implement, action: implement-and-iterate, description: "Build, test, and refine the change.", actor: resident-agent, environment: delegated-runtime, needs: [research], uses: [git-https]}
      - {id: draft, action: push-draft-pr, description: "Publish the implementation as a draft pull request.", actor: resident-agent, environment: delegated-runtime, needs: [implement], uses: [github, git-https]}
      - {id: ci, action: wait-for-required-ci, description: "Wait for every required check to pass.", actor: resident-agent, environment: delegated-runtime, needs: [draft], checks: [verify], shape: gate, uses: [github]}
      - {id: ready, action: undraft-after-ci, description: "Mark the pull request ready after CI passes.", actor: resident-agent, environment: delegated-runtime, needs: [ci], uses: [github]}
      - {id: auto_merge, action: enable-auto-merge, description: "Allow GitHub to merge once all gates pass.", actor: resident-agent, environment: delegated-runtime, needs: [ready], checks: [verify], uses: [github]}
      - {id: review, workflow: adversarial-review, description: "Request an independent CODEOWNERS review.", mode: github-codeowners, needs: [auto_merge]}
      - {id: revise, action: address-findings, description: "Resolve findings from the review.", actor: resident-agent, environment: delegated-runtime, needs: [review], if: "review.outcome == 'request-changes'", uses: [channels-github, github, git-https]}
      - {id: merge, action: auto-merge-after-required-agent-approval, description: "Let GitHub merge after the required approval.", actor: github-platform, environment: actions, needs: [review], if: "review.outcome == 'approve'", checks: [verify], uses: [github]}
    feedback:
      - {from: revise, to: ci, label: rerun CI and CODEOWNERS review}

  - id: adversarial-review
    title: Adversarial review
    description: Fan out one review subagent per lens over a change and submit one merged review envelope.
    modes: [local, self-started, github-codeowners]
    triggers:
      - {integration: channels-github, event: pull_request.review_requested, description: "Start when CODEOWNERS requests a pull request review.", rule: CODEOWNERS, environment: kubernetes}
    outputs: [outcome]
    nodes:
      - {id: lenses, action: spawn-lens-subagents, description: "One subagent per lens — criteria, correctness, checks, simplify — each returning a review envelope.", actor: review-bot, environment: delegated-runtime, skill: code-review, uses: [github]}
      - {id: merge_envelopes, action: merge-review-envelopes, description: "Pool the findings, drop what prior reviews raised, recompute the verdict.", actor: review-bot, environment: delegated-runtime, needs: [lenses], outputs: [outcome], shape: decision}
      - {id: deliver, action: submit-review-envelope, description: "Submit one formal review through the GitHub MCP, or return the envelope to the caller.", actor: review-bot, environment: delegated-runtime, needs: [merge_envelopes], uses: [github]}

  - id: bug-issue
    title: Bug issue
    description: Investigate a fix issue and assign the resulting coding work to a resident agent.
    triggers:
      - {integration: github-actions-events, event: issues.labeled, description: "Start when an issue receives the fix label.", rule: "label = fix", environment: actions}
    nodes:
      - {id: investigate, action: quick-investigation, description: "Quickly confirm the bug and likely scope.", actor: outfitter-bot, environment: actions, skill: issue-triage, uses: [gh]}
      - {id: assign, action: assign-issue, description: "Assign the fix to the resident coding agent.", actor: outfitter-bot, environment: actions, assignee: luce, target_environment: kubernetes, needs: [investigate], uses: [gh], shape: event}

  - id: issue-triage
    title: Issue triage
    description: Classify untyped issues and route features, fixes, and research into their delivery workflows.
    triggers:
      - {integration: github-actions-events, event: issues.opened, description: "Start when a new issue is opened.", environment: actions}
    nodes:
      - {id: classify, action: classify-issue-when-untyped, description: "Add a type only when the issue is untyped.", actor: outfitter-bot, environment: actions, skill: issue-triage, templates: [feat.yml, fix.yml, research.yml], outputs: [kind], uses: [gh], shape: decision}
      - {id: assign_resident, action: assign-resident-agent, description: "Assign feature work to a resident agent.", actor: outfitter-bot, environment: actions, assignee: resident-agent, event: issues.assigned, needs: [classify], if: "classify.kind == 'feat'", rule: "a configured resident owns the task", uses: [gh], shape: event}
      - {id: resident_factory, workflow: software-factory, description: "Implement the feature through the software factory.", needs: [assign_resident]}
      - {id: bug, workflow: bug-issue, description: "Investigate and assign the reported fix.", needs: [classify], if: "classify.kind == 'fix'"}
      - {id: research, workflow: research-triage, description: "Route the request to a research track.", needs: [classify], if: "classify.kind == 'research'"}

  - id: research-triage
    title: Research triage
    description: Classify research requests and route them into market, technical, or business investigation tracks.
    triggers:
      - {integration: github-actions-events, event: issues.labeled, description: "Start when an issue receives the research label.", rule: "label = research", environment: actions}
    nodes:
      - {id: classify, action: classify-research, description: "Choose the request's research track.", actor: outfitter-bot, environment: actions, skill: research-triage, templates: [research.yml], outputs: [kind], uses: [gh], shape: decision}
      - {id: market_competitive, action: label-market-competitive, description: "Mark market and competitive research.", actor: outfitter-bot, environment: actions, needs: [classify], if: "classify.kind == 'market/competitive'", label: "research:market-competitive", uses: [gh]}
      - {id: technical_spike, action: label-technical-spike, description: "Mark a focused technical investigation.", actor: outfitter-bot, environment: actions, needs: [classify], if: "classify.kind == 'technical/spike'", label: "research:technical-spike", uses: [gh]}
      - {id: business_finance, action: label-business-finance, description: "Mark business and financial research.", actor: outfitter-bot, environment: actions, needs: [classify], if: "classify.kind == 'business/finance'", label: "research:business-finance", uses: [gh]}

  - id: grafana-alert
    title: Grafana alert investigation
    description: Investigate a Grafana alert, create a fix issue, and hand it to issue triage.
    triggers:
      - {integration: channels-email, event: jmap.Email/new, description: "Start when Grafana sends an alert email.", source: grafana, environment: kubernetes}
    nodes:
      - {id: investigate, action: investigate-alert, description: "Inspect metrics, logs, dashboards, and alert context.", actor: incident-bot, environment: kubernetes, skill: incident-investigation, uses: [grafana-read]}
      - {id: issue, action: create-fix-issue, description: "Open a fix issue with the investigation evidence.", actor: incident-bot, environment: kubernetes, needs: [investigate], event: issues.opened, template: fix.yml, uses: [github]}
      - {id: triage, workflow: issue-triage, description: "Classify and route the new fix issue.", needs: [issue]}

  - id: persona-review
    title: Persona review
    description: Review website changes, documents, and other artifacts from a selected persona's perspective, then save a sourced report.
    nodes:
      - {id: select_context, action: select-persona-and-artifact, description: "Choose the persona and artifact to evaluate.", actor: review-coordinator, environment: workstation, skill: persona-review}
      - {id: launch, action: launch-isolated-reviewer, description: "Start an isolated reviewer with that context.", actor: review-coordinator, environment: workstation, assignee: persona-reviewer, needs: [select_context], uses: [outfitter-cli]}
      - {id: inspect, action: inspect-artifact, description: "Evaluate the artifact from the persona's perspective.", actor: persona-reviewer, environment: workstation, needs: [launch], skill: persona-review, uses: [playwright-browser]}
      - {id: report, action: write-sourced-report, description: "Write a sourced review with actionable findings.", actor: persona-reviewer, environment: workstation, needs: [inspect], outputs: [report]}
      - {id: capture, action: atomically-save-report, description: "Save the completed report atomically.", actor: review-coordinator, environment: workstation, needs: [report], path: docs/persona-reviews/, uses: [outfitter-cli]}
